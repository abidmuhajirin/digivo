<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2fa">
<meta name="robots" content="noindex">
<title>Reseller - {{BRAND}}</title>
<link rel="icon" href="/icons/yellow.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/yellow-180.png">
<meta name="apple-mobile-web-app-title" content="Reseller">
<link rel="manifest" href="/manifest/reseller.webmanifest">
<link rel="stylesheet" href="/css/app.css">
</head>
<body data-tone="yellow">
<main class="wrap stack app-main" id="reseller">
  <div class="topbar page-top">
    <a class="circle-btn" href="/" aria-label="Kembali ke halaman utama"><svg class="i" aria-hidden="true"><use href="/icons.svg#back"/></svg></a>
    <h1 class="grow">Masuk reseller</h1>
  </div>

  <form id="reseller-login" class="panel stack-sm">
    <h2>Masuk</h2>
    <label class="field"><span>Nomor WhatsApp</span><input name="whatsapp" inputmode="tel" maxlength="20" required placeholder="08xxxxxxxxxx" autocomplete="username"></label>
    <label class="field"><span>PIN</span><input class="pin" name="pin" type="password" inputmode="numeric" maxlength="6" required autocomplete="current-password"></label>
    <p class="form-msg" role="alert"></p>
    <button class="cta" type="submit">Masuk</button>
  </form>

  <details class="panel drawer">
    <summary>Lupa PIN</summary>
    <p class="muted">Belum terdaftar atau lupa PIN? <a class="text-link" href="https://wa.me/{{ADMIN_WA}}?text=Halo%20admin%2C%20saya%20belum%20terdaftar%20atau%20lupa%20PIN." target="_blank" rel="noopener">Hubungi admin</a>.</p>
  </details>
</main>
<nav class="dock" aria-label="Menu reseller" hidden>
  <button data-tab="aktivasi"><svg class="i" aria-hidden="true"><use href="/icons.svg#plus"/></svg>Aktivasi</button>
  <button data-tab="stok"><svg class="i" aria-hidden="true"><use href="/icons.svg#card"/></svg>Stok</button>
  <button data-tab="riwayat"><svg class="i" aria-hidden="true"><use href="/icons.svg#chat"/></svg>Riwayat</button>
  <button data-tab="akun"><svg class="i" aria-hidden="true"><use href="/icons.svg#sliders"/></svg>Akun</button>
</nav>
<script type="module" src="/js/reseller.js"></script>
</body>
</html>

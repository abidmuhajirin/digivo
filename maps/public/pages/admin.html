<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2fa">
<meta name="robots" content="noindex">
<title>Admin - {{BRAND}}</title>
<link rel="icon" href="/icons/white.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/white-180.png">
<meta name="apple-mobile-web-app-title" content="Admin">
<link rel="manifest" href="/manifest/admin.webmanifest">
<link rel="stylesheet" href="/css/app.css">
</head>
<body class="admin-ui" data-tone="yellow">
<main class="wrap app-main stack" id="admin">
  <form id="admin-login" class="panel stack-sm">
    <h2>Admin {{BRAND}}</h2>
    <label class="field"><span>Kata sandi</span><input name="password" type="password" required autocomplete="current-password"></label>
    <p class="form-msg" role="alert"></p>
    <button class="cta" type="submit">Masuk</button>
  </form>
</main>
<nav class="dock" aria-label="Menu admin" hidden>
  <button data-tab="jual"><svg class="i" aria-hidden="true"><use href="/icons.svg#lock"/></svg>Aktivasi</button>
  <button data-tab="kartu"><svg class="i" aria-hidden="true"><use href="/icons.svg#card"/></svg>Kartu</button>
  <button data-tab="reseller"><svg class="i" aria-hidden="true"><use href="/icons.svg#users"/></svg>Reseller</button>
  <button data-tab="bisnis"><svg class="i" aria-hidden="true"><use href="/icons.svg#store"/></svg>Bisnis</button>
</nav>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
